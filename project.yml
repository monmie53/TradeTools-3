name: TradeTools
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  TradeTools:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.tradetools
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
