name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild -project TradeTools.xcodeproj -scheme TradeTools \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TradeTools.app Payload/
          zip -qr TradeTools.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TradeTools-ipa
          path: TradeTools.ipa
